name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The manifest version must match the tag
        run: |
          version="$(jq -r .version custom_components/emby_library/manifest.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json has ${version}, the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Build the card
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: The committed bundle must match a fresh build
        run: git diff --exit-code -- custom_components/emby_library/frontend
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
